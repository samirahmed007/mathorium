name: Build Mathorium Desktop (Windows)
on:
  workflow_dispatch:
  push:
    branches: [desktop-foundation-v0.1.0]
    paths:
      - "electron/**"
      - "src/**"
      - "scripts/**"
      - ".github/workflows/build-desktop.yml"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
concurrency:
  group: mathorium-desktop-windows
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  windows-desktop:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install JavaScript dependencies
        run: npm install
      - name: Install model and icon build dependencies
        run: python -m pip install --upgrade huggingface_hub Pillow
      - name: Generate Windows application icon
        run: python scripts/create-windows-icon.py
      - name: Fetch pinned TexTeller INT8 model
        run: python scripts/fetch-desktop-models.py
      - name: Verify both offline model bundles
        run: npm run desktop:verify
      - name: Type-check desktop and renderer TypeScript
        run: npx tsc --noEmit
      - name: Build Mathorium renderer
        run: npm run build
      - name: Assemble source, bundled models and renderer ZIP
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "Mathorium-Desktop-Source-Models"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          foreach ($name in @("src","electron","scripts","public","dist")) {
            if (Test-Path $name) { Copy-Item -Path $name -Destination $stage -Recurse -Force }
          }
          foreach ($name in @("package.json","package-lock.json","index.html","vite.config.ts","tsconfig.json","tsconfig.app.json","tsconfig.node.json","DESKTOP-BUILD.md","README.md")) {
            if (Test-Path $name) { Copy-Item -Path $name -Destination $stage -Force }
          }
          # Vite copies public model files to dist. Keep only the canonical public copies
          # in this source archive; Electron and the renderer are configured accordingly.
          foreach ($duplicate in @("models","ort","ort-hf")) {
            $path = Join-Path $stage ("dist\\" + $duplicate)
            if (Test-Path $path) { Remove-Item $path -Recurse -Force }
          }
          $zip = Join-Path $PWD "Mathorium-Desktop-10.0.0-Source-Models-Windows-x64.zip"
          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath $zip -CompressionLevel Optimal -Force
          Get-Item $zip | Format-List Name,Length
      - name: Upload source and model package before installer compression
        uses: actions/upload-artifact@v4
        with:
          name: Mathorium-Desktop-10.0.0-Source-Models-Windows-x64
          path: Mathorium-Desktop-10.0.0-Source-Models-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
      - name: Package Windows x64 installer and portable EXE
        run: npx electron-builder --win nsis portable --x64 --publish never
      - name: Verify outputs and calculate SHA-256
        shell: pwsh
        run: |
          $files = Get-ChildItem release -File
          if (-not ($files | Where-Object { $_.Name -like "*.exe" })) { throw "No EXE package was generated." }
          $files | Get-FileHash -Algorithm SHA256 | Format-Table
      - name: Assemble complete source + models + Windows builds ZIP
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "Mathorium-Desktop-Complete"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          foreach ($name in @("src","electron","scripts","public","dist",".github/workflows")) {
            if (Test-Path $name) { Copy-Item -Path $name -Destination $stage -Recurse -Force }
          }
          foreach ($name in @("package.json","package-lock.json","index.html","vite.config.ts","tsconfig.json","tsconfig.app.json","tsconfig.node.json","DESKTOP-BUILD.md","README.md")) {
            if (Test-Path $name) { Copy-Item -Path $name -Destination $stage -Force }
          }
          # Do not duplicate the multi-hundred-megabyte models already in public/.
          foreach ($duplicate in @("models","ort","ort-hf")) {
            $path = Join-Path $stage ("dist\\" + $duplicate)
            if (Test-Path $path) { Remove-Item $path -Recurse -Force }
          }
          $builds = Join-Path $stage "windows-build"
          New-Item -ItemType Directory -Force -Path $builds | Out-Null
          Get-ChildItem release -File | Where-Object { $_.Extension -in @(".exe",".blockmap") } | Copy-Item -Destination $builds -Force
          if (-not (Test-Path (Join-Path $stage "public\models\manifest.json"))) { throw "Model manifest missing from complete package." }
          $zip = Join-Path $PWD "release\Mathorium-Desktop-10.0.0-Complete-Windows-x64.zip"
          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath $zip -CompressionLevel Optimal -Force
          Get-Item $zip | Format-List Name,Length,FullName
      - name: Split complete package into download-safe parts
        shell: pwsh
        run: |
          $zip = Join-Path $PWD "release\Mathorium-Desktop-10.0.0-Complete-Windows-x64.zip"
          $chunkBytes = 400MB
          $input = [System.IO.File]::OpenRead($zip)
          $buffer = New-Object byte[] (8MB)
          $index = 1
          try {
            while ($input.Position -lt $input.Length) {
              $part = "{0}.part{1:D2}" -f $zip, $index
              $output = [System.IO.File]::Create($part)
              try {
                $remaining = [Math]::Min($chunkBytes, $input.Length - $input.Position)
                while ($remaining -gt 0) {
                  $read = $input.Read($buffer, 0, [int][Math]::Min($buffer.Length, $remaining))
                  if ($read -le 0) { throw "Unexpected end of complete ZIP while splitting." }
                  $output.Write($buffer, 0, $read)
                  $remaining -= $read
                }
              } finally { $output.Dispose() }
              Write-Host ("Created part {0}: {1:N0} bytes" -f $index, (Get-Item $part).Length)
              $index++
            }
          } finally { $input.Dispose() }
          $count = $index - 1
          if ($count -gt 8) { throw "Complete package needs $count parts; increase the upload steps." }
          "PART_COUNT=$count" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Upload complete package part 01
        uses: actions/upload-artifact@v4
        with:
          name: Mathorium-Desktop-Complete-Part-01
          path: release/Mathorium-Desktop-10.0.0-Complete-Windows-x64.zip.part01
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload complete package part 02
        uses: actions/upload-artifact@v4
        with:
          name: Mathorium-Desktop-Complete-Part-02
          path: release/Mathorium-Desktop-10.0.0-Complete-Windows-x64.zip.part02
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload complete package part 03
        uses: actions/upload-artifact@v4
        with:
          name: Mathorium-Desktop-Complete-Part-03
          path: release/Mathorium-Desktop-10.0.0-Complete-Windows-x64.zip.part03
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload complete package part 04
        uses: actions/upload-artifact@v4
        with:
          name: Mathorium-Desktop-Complete-Part-04
          path: release/Mathorium-Desktop-10.0.0-Complete-Windows-x64.zip.part04
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload complete package part 05
        uses: actions/upload-artifact@v4
        with:
          name: Mathorium-Desktop-Complete-Part-05
          path: release/Mathorium-Desktop-10.0.0-Complete-Windows-x64.zip.part05
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload complete package part 06
        uses: actions/upload-artifact@v4
        with:
          name: Mathorium-Desktop-Complete-Part-06
          path: release/Mathorium-Desktop-10.0.0-Complete-Windows-x64.zip.part06
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload complete package part 07
        uses: actions/upload-artifact@v4
        with:
          name: Mathorium-Desktop-Complete-Part-07
          path: release/Mathorium-Desktop-10.0.0-Complete-Windows-x64.zip.part07
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload complete package part 08
        uses: actions/upload-artifact@v4
        with:
          name: Mathorium-Desktop-Complete-Part-08
          path: release/Mathorium-Desktop-10.0.0-Complete-Windows-x64.zip.part08
          if-no-files-found: ignore
          retention-days: 30
