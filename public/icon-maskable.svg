<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Maskable variant. Android crops this to whatever shape the launcher uses, so
       the tile runs full-bleed (no corner radius of our own to be clipped into a
       lopsided one) and the monogram is scaled to sit inside the 80% safe circle. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="52%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <radialGradient id="gloss" cx="26%" cy="16%" r="78%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="62%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="node" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#tile)"/>
  <rect width="512" height="512" fill="url(#gloss)"/>
  <g transform="translate(256 256) scale(0.68) translate(-256 -256)">
    <path d="M136 360V152l120 136 120-136v208" fill="none" stroke="#ffffff" stroke-width="52" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="256" cy="288" r="34" fill="#ffffff"/>
    <circle cx="256" cy="288" r="25" fill="url(#node)"/>
  </g>
</svg>
